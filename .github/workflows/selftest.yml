name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    # better-sqlite3 của dự án dùng trên Windows nên chạy CI trên Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run selftest
