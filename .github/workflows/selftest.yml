name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    # better-sqlite3 của dự án dùng trên Windows nên chạy CI trên Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts # better-sqlite3 13 đã đóng gói sẵn prebuilds, tránh node-gyp biên dịch lại
      - run: npm run selftest
      # test của phần Hermes (Python, chỉ thư viện chuẩn, không gọi mạng ngoài)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s hermes-ticket/tests
